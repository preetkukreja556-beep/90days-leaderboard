# test -> deploy to Development -> verify
#
# Pipeline global variables (console -> Pipelines -> your pipeline -> Global Variables):
#   CATALYST_TOKEN  CLI token generated by `catalyst token:generate` (required)
#   GITHUB_TOKEN    GitHub read token for the fetcher (required; rotate if it appeared in logs)
# Development project, data center, API URL, and MAX_FORKS are set below for this app.
#
# No `pipeline-when` on purpose: the pipeline is already bound to branch main, and a manual run reports
# event.ref as `main` rather than `refs/heads/main`, so that condition made every manual run fail.
#
# No `images:` block: use Catalyst's default Ubuntu runner and keep the toolchain consistent by installing
# Node 22 and a pinned Catalyst CLI. The AppSail job also needs a Docker daemon to build the API image.
#
# A deploy replaces the function's variables with catalyst-config.json. The fetcher job fills that file
# on the runner from the global GITHUB_TOKEN and its configured fork limit.
version: 1.0

jobs:
  # Install the pinned CLI before the check script calls `catalyst --version`.
  preflight:
    steps:
      - >-
        CATALYST_TOKEN="<< env.CATALYST_TOKEN >>" CATALYST_ORG="60093283351"
        CATALYST_DC="in" PROJECT_ID="100861000000013053"
        DEV_API_URL="https://leaderboard-api-50047159087.development.catalystappsail.in"
        GITHUB_TOKEN="<< env.GITHUB_TOKEN >>" MAX_FORKS="50"
        sh scripts/with-node22.sh sh scripts/with-catalyst.sh sh scripts/check-pipeline-vars.sh

  # Tests and a full dependency audit, including build and test tooling, gate every deploy.
  test-backend:
    steps:
      - sh scripts/with-node22.sh sh -c "cd backend && npm ci && npm test && npm audit --audit-level=high"

  test-frontend:
    steps:
      - sh scripts/with-node22.sh sh -c "cd frontend && npm ci && npm test && npm run build && npm audit --audit-level=high"

  test-fetcher:
    steps:
      - sh scripts/with-node22.sh sh -c "cd functions/fetcher && npm ci && npm test && npm audit --audit-level=high"

  deploy-fetcher:
    steps:
      - GITHUB_TOKEN="<< env.GITHUB_TOKEN >>" MAX_FORKS="50" node scripts/inject-fetcher-env.js
      - >-
        sh scripts/with-node22.sh sh scripts/with-catalyst.sh catalyst deploy --only functions:fetcher
        --project 100861000000013053 --org 60093283351 --dc in
        --token << env.CATALYST_TOKEN >> -ni

  # AppSail runs this API as a custom Docker runtime, matching backend/Dockerfile and the deployed service.
  deploy-api:
    steps:
      - docker version
      - docker build --platform linux/amd64 -t leaderboard-api:pipeline backend
      - >-
        sh scripts/with-node22.sh sh scripts/with-catalyst.sh catalyst deploy appsail --name leaderboard-api
        --source docker://leaderboard-api:pipeline --port 9000
        --project 100861000000013053 --org 60093283351 --dc in
        --token << env.CATALYST_TOKEN >> -ni

  # Slate bakes the API address into the JavaScript at build time, so this runs after the API is up.
  deploy-web:
    steps:
      - echo "VITE_API_BASE=https://leaderboard-api-50047159087.development.catalystappsail.in" > frontend/.env.production
      - node scripts/relink-slate.js
      - >-
        sh scripts/with-node22.sh sh scripts/with-catalyst.sh catalyst deploy slate leaderboard-web -m "pipeline build"
        --project 100861000000013053 --org 60093283351 --dc in
        --token << env.CATALYST_TOKEN >> -ni

  # Health, schema, data, and no X-Powered-By header. Retries while a fresh container starts.
  smoke-dev:
    steps:
      - sh scripts/smoke.sh "https://leaderboard-api-50047159087.development.catalystappsail.in"

# Promotion to Production is not wired up on purpose. The CLI used while building this (1.28.0) has no
# `catalyst deploy --production` flag, so that step could not be verified. Once the Production
# environment exists and you have a promotion command that works, add a manual approval and a deploy
# job after `verify`, for example:
#
#   approve-production:
#     type:
#       type-name: approval
#       type-variables:
#         reviewers:
#           - << env.REVIEWER_EMAIL >>
#         message: Development is deployed and verified. Approve to promote to Production.
#
# Production also needs its own GITHUB_TOKEN, MAX_FORKS, job pool, cron and CORS_ORIGIN.

stages:
  - name: preflight
    jobs:
      - preflight
  # This account allows 2 parallel jobs per stage, so the third test job runs after the pair.
  - name: test
    jobs:
      - - test-backend
        - test-fetcher
      - test-frontend
  - name: deploy-dev
    jobs:
      - - deploy-fetcher
        - deploy-api
      - deploy-web
  - name: verify
    jobs:
      - smoke-dev
